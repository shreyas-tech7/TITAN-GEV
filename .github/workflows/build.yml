name: Build and sync

# Three jobs. "build" checks the wrapper tests, the pinned upstream (npm ci and npm run doctor),
# a production build of the app, and an end to end gate test against that build. "docker" builds the
# image that Render and Hugging Face build, runs it under a 512 MB limit, and probes it. "sync" pushes
# main to a Hugging Face Space when the HF_TOKEN repository secret exists. Render deploys on its own
# when its GitHub connection sees these checks pass. Runners are pinned to ubuntu-24.04 so a change
# to the ubuntu-latest label cannot surprise the build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Wrapper tests
        run: npm test

      - name: Fetch the pinned upstream commit
        run: npm run upstream:fetch

      - name: Install upstream dependencies (npm ci)
        working-directory: .upstream
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Upstream setup doctor (npm run doctor)
        working-directory: .upstream
        run: npm run doctor

      - name: Build upstream with the placeholder token
        working-directory: .upstream
        env:
          CESIUM_ION_TOKEN: __GEV_CESIUM_ION_TOKEN__
        run: npx vite build

      - name: Gate smoke test against the real build
        run: npm run smoke

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t titan-gev:ci .

      - name: Run the image and probe the gate
        run: |
          secret="$(openssl rand -hex 24)"
          docker run -d --name gev --memory 512m --memory-swap 512m -p 127.0.0.1:17860:7860 -e GEV_SHARED_SECRET="$secret" titan-gev:ci
          ready=""
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17860/healthz)" = "200" ]; then ready=yes; break; fi
            sleep 2
          done
          [ -n "$ready" ] || { docker logs gev; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17860/)" = "401" ] || { echo "expected 401 without a token"; exit 1; }
          if docker logs gev 2>&1 | grep -qF "$secret"; then echo "secret found in container logs"; exit 1; fi
          [ "$(docker inspect -f '{{.State.OOMKilled}}' gev)" = "false" ] || { echo "the container hit the 512 MB limit"; exit 1; }
          echo "app memory after start: $(docker stats --no-stream --format '{{.MemUsage}}' gev)"
          docker rm -f gev

  sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for the HF_TOKEN secret
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_TOKEN is not set, so the Space sync was skipped."
          fi

      - name: Install the Hugging Face client
        if: steps.token.outputs.present == 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet "huggingface_hub==1.33.0"

      - name: Sync main to the Space
        if: steps.token.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID || 'Cozmik7/titan-gev' }}
        run: .venv/bin/python scripts/sync_to_space.py
