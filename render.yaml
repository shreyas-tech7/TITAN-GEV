# Render Blueprint for the free web service. Create it with New, then Blueprint, and point it at this repo.
# Render asks for the two sync:false values during that first creation.
services:
  - type: web
    name: titan-gev
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      # Required. The Worker's public signing key, base64url of the 32 raw bytes (the JWK x value from
      # GET /gev/jwks on the Worker). It is public, not a secret. The host cannot make tokens with it.
      - key: GEV_VERIFY_KEY
        sync: false
      # Optional. The free Cesium ion token. Leave it blank for the keyless basemap.
      - key: CESIUM_ION_TOKEN
        sync: false
      # Only the TITAN dashboard origin may frame the globe.
      - key: GEV_FRAME_ANCESTORS
        value: https://shreyas-tech7.github.io
      # Render puts Cloudflare in front, so X-Forwarded-For is not trustworthy.
      - key: GEV_CLIENT_IP_HEADER
        value: cf-connecting-ip
